<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackerBot Cosmic Hub</title>
    <link rel="stylesheet" href="./crackerbot-styles.css">
    <link rel="stylesheet" href="./crackerbot-nav.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="cosmic-theme">
    <div class="modal-overlay" id="project-modal-overlay"></div>
    <div class="project-type-modal" id="project-type-modal">
        <button class="modal-close-btn" onclick="closeProjectModal()">×</button>
        <h2>🚀 Choose Your Project Type</h2>
        <div class="project-types-grid" id="project-types-grid"></div>
    </div>

    <div class="app-container">
        <div class="token-scanner-panel">
            <div class="scanner-header">
                <h3>📡 Token Scanner</h3>
                <button class="refresh-btn" onclick="refreshTokens()">Refresh</button>
            </div>
            <div id="token-list" class="token-list">
                <div class="token-item">SOL $98.45 ↑ 5%</div>
                <div class="token-item">BONK $0.000024 ↑ 12%</div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <div class="app-title">
                    <span class="bot-icon">🚀</span>
                    <h1>CrackerBot - <span id="user-name">Guest</span></h1>
                </div>
                <div class="header-buttons">
                    <span id="connection-status" style="padding:5px 12px;border-radius:12px;font-size:12px;margin-right:10px;background:rgba(255,170,0,0.3);color:#ffaa00;">⏳ Connecting...</span>
                    <button class="warp-btn" onclick="warpReconnect()">🌀 Warp</button>
                </div>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div id="choice-bubbles" class="choice-bubbles"></div>
            <div id="task-status-section" class="task-status-section" style="display:none !important;">
                <h3>Building: <span id="task-name"></span></h3>
                <p>Status: <span id="task-status"></span></p>
            </div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div class="wallets-panel">
            <div class="wallet-header">
                <h3>💼 Wallets</h3>
                <button class="wallet-connect-btn" onclick="connectWallet()">Connect Wallet</button>
            </div>
            <div id="wallet-list">
                <div class="wallet-placeholder" style="text-align: center; padding: 20px; color: #888;">
                    Connect a wallet to get started
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts in correct order -->
    <script src="./crackerbot-nav.js"></script>
    <script src="./socket-init.js"></script>
    <script src="./crackerbot-ai-connector.js"></script>
    <script src="./crackerbot-live-streaming-preview.js"></script>
    <script src="./crackerbot-main.js?v=20250131"></script>
    <script src="./crackerbot-redis.js"></script>
    <script src="./crackerbot-tracker.js"></script>
    <script src="./crackerbot-tokens.js?v=20250131d"></script>
    <script src="./crackerbot-wallets.js?v=20250131d"></script>
    <script src="./crackerbot-warp.js"></script>
    <script src="./crackerbot-config.js"></script>
    <script src="./crackerbot-projects.js"></script>
    <script src="./crackerbot-project-manager.js"></script>
    <script src="./crackerbot-all-projects.js"></script>
    <script src="./crackerbot-build.js"></script>
    <script src="./crackerbot-web-builder.js"></script>
    <script src="./crackerbot-framework-builder.js"></script>
    <script src="./crackerbot-game-builder.js"></script>
    <script src="./crackerbot-bot-builder.js"></script>
    <script src="./crackerbot-web3-builder.js"></script>
    <script src="./crackerbot-backend-builder.js"></script>
    <script src="./crackerbot-mobile-builder.js"></script>
    <script src="./crackerbot-tool-builder.js"></script>
    <script src="./crackerbot-ai-builder.js"></script>
    <script src="./check-backend-connection.js"></script>
    <script src="./fix-edit-button.js"></script>
    <script src="./fix-preview-button.js"></script>
    <script src="./crackerbot-themes-fixed.js"></script>
    <script src="./welcome-name.js"></script>
    <script src="./crackerbot-backend-config.js"></script>

    <script>
    // Connect live preview to socket and set up all handlers
    (function() {
        function connectLivePreview() {
            if (!window.socket || !window.livePreview) {
                setTimeout(connectLivePreview, 500);
                return;
            }
            
            window.livePreview.socket = window.socket;
            console.log('✅ Live preview connected to socket');
            
            // Listen for open_live_editor
            window.socket.on('open_live_editor', function(data) {
                console.log('📺 open_live_editor', data);
                if (window.livePreview && window.livePreview.autoOpen) {
                    window.livePreview.autoOpen(data);
                }
            });
            
            // Listen for live_build_update
            window.socket.on('live_build_update', function(data) {
                console.log('🔨 live_build_update', data.type);
                if (window.livePreview && window.livePreview.handleLiveBuildUpdate) {
                    window.livePreview.handleLiveBuildUpdate(data);
                }
            });
            
            // Listen for project_generated
            window.socket.on('project_generated', function(data) {
                console.log('🎉 project_generated', data.projectName);
                if (data.files) {
                    if (window.livePreview) window.livePreview.files = data.files;
                    if (window.currentTask) window.currentTask.files = data.files;
                    
                    // Save to localStorage
                    try {
                        const projects = JSON.parse(localStorage.getItem('crackerBotProjects') || '[]');
                        const proj = {
                            taskId: data.taskId || Date.now(),
                            projectName: data.projectName,
                            projectType: data.projectType || 'web-app',
                            files: data.files,
                            timestamp: Date.now()
                        };
                        const idx = projects.findIndex(p => p.projectName === data.projectName);
                        if (idx >= 0) projects[idx] = proj; else projects.push(proj);
                        localStorage.setItem('crackerBotProjects', JSON.stringify(projects));
                        console.log('💾 Project saved to localStorage');
                    } catch(e) {}
                }
            });
        }
        
        setTimeout(connectLivePreview, 1000);
        
        // Health check
        setTimeout(function() {
            console.log('═'.repeat(40));
            console.log('🚀 CRACKERBOT HEALTH CHECK');
            console.log('Socket:', window.socket?.connected ? '✅' : '❌');
            console.log('livePreview:', window.livePreview ? '✅' : '❌');
            console.log('═'.repeat(40));
        }, 3000);
    })();
    </script>
<script src="./debug-live-preview.js"></script>
</body>
</html>
